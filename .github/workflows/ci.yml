name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A PR compares against its base branch. A push to main compares against
      # the previous main commit — not github.event.before, which is the
      # all-zeros sha on force-push and branch creation, silently changing what
      # "affected" means. HEAD~1 is identical for the ordinary merge flow and
      # well-defined in every case (fetch-depth: 0 above guarantees it exists).
      - name: Set affected range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "NX_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          else
            echo "NX_BASE=$(git rev-parse HEAD~1)" >> "$GITHUB_ENV"
          fi
          echo "NX_HEAD=${{ github.sha }}" >> "$GITHUB_ENV"

      - run: npx nx affected -t lint --base=$NX_BASE --head=$NX_HEAD --parallel=3
      - run: npx nx affected -t typecheck --base=$NX_BASE --head=$NX_HEAD --parallel=3
      - run: npx nx affected -t test --base=$NX_BASE --head=$NX_HEAD --parallel=3
      - run: npx nx affected -t test:container --base=$NX_BASE --head=$NX_HEAD --parallel=3
      - run: npx nx affected -t build --base=$NX_BASE --head=$NX_HEAD --parallel=3
