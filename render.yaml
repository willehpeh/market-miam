# Exported from Render on 2026-06-21T14:41:44Z
version: "1"
projects:
  - name: Market Miam
    environments:
      - name: Production
        services:
          - type: web
            name: api
            runtime: node
            repo: https://github.com/willehpeh/market-miam
            plan: starter
            envVars:
              # The domain assumes a single region, Europe/Paris (see the ponytail note in
              # find-customer-storefront.handler.ts). DateClock.today() reads the host's local
              # date, and the host is UTC, so for the hour or two after Paris midnight "today"
              # is still yesterday — which is where FindUpcomingMarketDays starts its window.
              # Node resolves this at startup through its bundled ICU; a typo silently falls
              # back to UTC rather than failing, so check the zone in the boot log after a change.
              - key: TZ
                value: Europe/Paris
              - key: AUTH0_ISSUER
                sync: false
              - key: AUTH0_AUDIENCE
                sync: false
              # Cloudinary signed uploads (vendor photo uploads); set all three in the dashboard
              - key: CLOUDINARY_CLOUD_NAME
                sync: false
              - key: CLOUDINARY_API_KEY
                sync: false
              - key: CLOUDINARY_API_SECRET
                sync: false
              - key: DATABASE_CONNECTION_STRING
                fromDatabase:
                  name: event-store
                  property: connectionString
              # OpenTelemetry -> Honeycomb (ADR 0026)
              - key: OTEL_SERVICE_NAME
                value: api
              - key: OTEL_EXPORTER_OTLP_ENDPOINT
                value: https://api.honeycomb.io
              - key: OTEL_EXPORTER_OTLP_PROTOCOL
                value: http/protobuf
              # Secret: set in dashboard as `x-honeycomb-team=<ingest-key>`
              - key: OTEL_EXPORTER_OTLP_HEADERS
                sync: false
            region: frankfurt
            buildCommand: npm ci && npx nx run api:build
            startCommand: node dist/apps/api/main.js
            domains:
              - api.marketmiam.fr
            autoDeployTrigger: checksPass
            buildFilter:
              paths:
                - apps/api/**
                - packages/**
                - package.json
                - package-lock.json
                - nx.json
                - tsconfig.base.json
          - type: web
            name: vendor-frontend
            runtime: static
            repo: https://github.com/willehpeh/market-miam
            buildCommand: npm ci && npx nx run vendor-frontend:build
            staticPublishPath: ./dist/apps/vendor-frontend/browser
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            domains:
              - app.marketmiam.fr
            autoDeployTrigger: checksPass
            renderSubdomainPolicy: disabled
            buildFilter:
              paths:
                - apps/vendor-frontend/**
                - packages/**
                - package.json
                - package-lock.json
                - nx.json
                - tsconfig.base.json
          - type: web
            name: customer-frontend
            runtime: node
            repo: https://github.com/willehpeh/market-miam
            plan: starter
            region: frankfurt
            buildCommand: npm ci && npx nx run customer-frontend:build
            startCommand: node dist/apps/customer-frontend/server/server.mjs
            domains:
              - '*.marketmiam.fr'
            autoDeployTrigger: checksPass
            # Vendor storefronts are addressed by subdomain, so the SSR resolver reads the
            # host's first label as the vendor. On the bare onrender.com hostname that label
            # is the service name, which sent a scanner-driven 404 to the API every couple of
            # hours. Closing it leaves only *.marketmiam.fr, where the label is always a vendor.
            renderSubdomainPolicy: disabled
            buildFilter:
              paths:
                - apps/customer-frontend/**
                - packages/**
                - package.json
                - package-lock.json
                - nx.json
                - tsconfig.base.json
          - type: web
            name: website
            runtime: static
            repo: https://github.com/willehpeh/market-miam
            buildCommand: npm ci && npx nx build website
            staticPublishPath: ./dist/apps/website
            domains:
              - www.marketmiam.fr
              - marketmiam.fr
            autoDeployTrigger: checksPass
            renderSubdomainPolicy: disabled
            buildFilter:
              paths:
                - apps/website/**
                - packages/**
                - package.json
                - package-lock.json
                - nx.json
                - tsconfig.base.json
          # The interactive test map (tools/test-map). Built with bare Node — the
          # generator reads spec files straight off the checkout, no npm ci needed.
          - type: web
            name: test-map
            runtime: static
            repo: https://github.com/willehpeh/market-miam
            buildCommand: node tools/test-map/generate.mjs
            staticPublishPath: ./tmp/test-map
            autoDeployTrigger: checksPass
            buildFilter:
              paths:
                - apps/**
                - packages/**
                - test/**
                - tools/test-map/**
          # The event model (tools/event-model) — the system's behaviour as
          # slices of commands, events, read models and automations, derived
          # from the packages test suite and the domain package's declared
          # seams. Same contract as test-map: bare Node, no npm ci.
          - type: web
            name: event-model
            runtime: static
            repo: https://github.com/willehpeh/market-miam
            buildCommand: node tools/event-model/generate.mjs
            staticPublishPath: ./tmp/event-model
            autoDeployTrigger: checksPass
            buildFilter:
              paths:
                - apps/api/**
                - packages/market-days/**
                - test/**
                - tools/event-model/**
        databases:
          - name: event-store
            databaseName: marketmiam
            user: marketmiam
            plan: basic-256mb
            region: frankfurt
            postgresMajorVersion: "18"
