<!doctype html>

    <meta charset="utf-8" />

    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- No font or icon CDN here, deliberately. A storefront is a public page whose
         visitors consented to nothing, so their IP is not ours to hand to Google or
         Font Awesome (ADR 0054). The faces come from packages/design-system/fonts.css
         and Font Awesome from the npm package, both served from our own origin. CI
         fails if a third-party host reappears. -->
    <link
      rel="preload"
      href="/fonts/hanken-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
